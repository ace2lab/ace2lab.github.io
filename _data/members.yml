  bio:
    POSTECH 화학공학과에서 학사 및 박사학위를 취득하고, 동 대학 박사후연구원, 삼성전자 DS(Device Solution)부문 CTO_반도체연구소 Staff Engineer(차세대
    메모리 공정), 한국생산기술연구원(KITECH) 울산본부 선임연구원을 거쳐 경북대학교 에너지화학공학과 부교수로 재직 중입니다. 차세대 배터리·슈퍼커패시터
