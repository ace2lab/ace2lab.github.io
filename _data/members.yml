  summary: 차세대 배터리·슈퍼커패시터 전극 소재, 부존량이 풍부한 금속 기반 환경·에너지 촉매, 세라믹·금속 3D 프린팅용 적층제조 소재를 연구합니다. 삼성전자 DS(Device Solution)부문 CTO_반도체연구소, POSTECH 박사후연구원, 한국생산기술연구원(KITECH)을 거친 산·학·연 융합 연구 경험을 바탕으로 청정 에너지 변환, 환경 정화, 지속가능한 제조를 위한 확장 가능한 소재 기술을 개발하고 있습니다.
  summary_i18n:
    ko: 차세대 배터리·슈퍼커패시터 전극 소재, 부존량이 풍부한 금속 기반 환경·에너지 촉매, 세라믹·금속 3D 프린팅용 적층제조 소재를 연구합니다. 삼성전자 DS(Device Solution)부문 CTO_반도체연구소, POSTECH 박사후연구원, 한국생산기술연구원(KITECH)을 거친 산·학·연 융합 연구 경험을 바탕으로 청정 에너지 변환, 환경 정화, 지속가능한 제조를 위한 확장 가능한 소재 기술을 개발하고 있습니다.
    en: Researches next-generation battery and supercapacitor electrode materials, earth-abundant environmental and energy catalysts, and ceramic/metal 3D additive manufacturing materials. Building on industry-academia-institute R&D experience at Samsung Electronics DS Division (Semiconductor R&D Center), POSTECH, and KITECH, Prof. Kim develops scalable material technologies for clean energy conversion, environmental remediation, and sustainable manufacturing.
    ja: 次世代バッテリー・スーパーキャパシタ電極材料、地殻に豊富な金属に基づく環境・エネルギー触媒、およびセラミックス・金属3Dプリンティング用積層造形材料を研究しています。サムスン電子 DS部門 半導体研究所、POSTECH博士研究員、韓国生産技術研究院（KITECH）を経た産学官連携の研究経験を基に、クリーンエネルギー変換、環境浄化、持続可能な製造のためのスケーラブルな材料技術を開発しています。
    zh: 致力于下一代电池与超级电容器电极材料、丰产金属基环境与能源催化剂，以及陶瓷/金属 3D 打印增材制造材料研究。依托在三星电子 DS 事业部 半导体研究所、浦项科技大学（POSTECH）及韩国生产技术研究院（KITECH）积累的产学研多元研发经历，开发面向清洁能源转化、环境净化与可持续制造的规模化材料技术。
  card_summary: 차세대 배터리·슈퍼커패시터 전극 소재, 부존량이 풍부한 금속 기반 환경·에너지 촉매, 세라믹·금속 3D 프린팅용 적층제조 소재를 연구합니다.
    전기화학 및 SCR 촉매 설계로 청정 에너지 변환과 환경 정화를 구현하고, 적층제조 기반 형상 설계로 지속가능한 제조 기술까지 확장합니다. 실험실
    성과가 실제 공정으로 이어지도록 확장 가능한 소재 기술을 지향합니다.
  card_summary_i18n:
    ko: 차세대 배터리·슈퍼커패시터 전극 소재, 부존량이 풍부한 금속 기반 환경·에너지 촉매, 세라믹·금속 3D 프린팅용 적층제조 소재를 연구합니다. 전기화학 및 SCR 촉매 설계로 청정 에너지 변환과 환경 정화를 구현하고, 적층제조 기반 형상 설계로 지속가능한 제조 기술까지 확장합니다. 실험실 성과가 실제 공정으로 이어지도록 확장 가능한 소재 기술을 지향합니다.
    en: Investigates next-generation battery and supercapacitor electrodes, earth-abundant environmental and energy catalysts, and ceramic/metal 3D additive manufacturing materials. Designs electrochemical and De-NOx SCR catalysts for clean energy conversion and emission control while extending to geometry-tailored additive manufacturing. Pursues scalable material technologies that bridge laboratory discovery and industrial processing.
    ja: 次世代バッテリー・スーパーキャパシタ電極材料、地殻に豊富な金属系環境・エネルギー触媒、およびセラミックス・金属3Dプリンティング用積層造形材料を研究しています。電気化学およびSCR触媒設計によりクリーンエネルギー変換と環境浄化を実現し、積層造形に基づく形状設計で持続可能な製造技術へと拡張します。研究室の成果が実プロセスへ直結するスケーラブルな材料技術を志向しています。
    zh: 研究下一代电池与超级电容器电极材料、丰产金属基环境与能源催化剂，以及陶瓷与金属 3D 打印增材制造材料。通过电化学与 SCR 催化剂设计实现清洁能源转化与尾气净化，并结合增材制造构型设计拓展可持续制造技术。致力于推动实验室成果向工业实际工艺转化的规模化材料工程。
