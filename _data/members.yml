  affiliation_ko: 경북대학교 과학기술대학 에너지화학공학과
  affiliation_en: Department of Energy Chemical Engineering, College of Science and
    Technology, Kyungpook National University
  email: cy.yim@knu.ac.kr
  photo: assets/img/team/changyong_yim_portrait.jpg
  photo_position: center 30%
  summary: 초고속 제논 플래시광(IPL) 광열처리와 레이저 유도 그래핀(LIG) 공정을 기반으로 2D MXene·MOF 복합소재를 설계하여, 차세대 하이브리드 슈퍼커패시터, 고성능 리튬이온전지 음극, 고감도 유연 생체·가스 센서를 연구합니다. 삼성전자 IM(IT·모바일)부문 무선사업부, POSTECH, University of Calgary(Canada) 박사후연구원, 포항산업과학연구원(RIST)을 거친 산·학·연 융합 연구 경험을 바탕으로 ACE² Lab을 공동으로 이끌고 있습니다.
  summary_i18n:
    ko: 초고속 제논 플래시광(IPL) 광열처리와 레이저 유도 그래핀(LIG) 공정을 기반으로 2D MXene·MOF 복합소재를 설계하여, 차세대 하이브리드 슈퍼커패시터, 고성능 리튬이온전지 음극, 고감도 유연 생체·가스 센서를 연구합니다. 삼성전자 IM(IT·모바일)부문 무선사업부, POSTECH, University of Calgary(Canada) 박사후연구원, 포항산업과학연구원(RIST)을 거친 산·학·연 융합 연구 경험을 바탕으로 ACE² Lab을 공동으로 이끌고 있습니다.
    en: Designs 2D MXene and MOF nanocomposites via ultrafast xenon Intense Pulsed Light (IPL) photothermal processing and Laser-Induced Graphene (LIG) patterning for next-generation hybrid supercapacitors, high-performance Li-ion battery anodes, and ultrasensitive flexible physiological and gas sensors. Drawing on industry-academia-institute R&D experience at Samsung Electronics IM Division, POSTECH, the University of Calgary (Canada), and RIST, Prof. Yim co-directs ACE² Lab.
    ja: 超高速キセノンフラッシュ光（IPL）光熱処理とレーザー誘起グラフェン（LIG）プロセスを基盤に2D MXene・MOF複合材料を設計し、次世代ハイブリッドスーパーキャパシタ、高性能リチウムイオン電池負極、および高感度フレキシブル生体・ガスセンサーを研究しています。サムスン電子 IM部門 無線事業部、POSTECH、カルガリー大学（カナダ）博士研究員、浦項産業科学研究院（RIST）を経た産学官連携の研究経験を基に、ACE² Labを共同主宰しています。
    zh: 基于超快氙灯强脉冲光（IPL）光热处理与激光诱导石墨烯（LIG）工艺设计二维 MXene 与 MOF 纳米复合材料，致力于下一代混合超级电容器、高性能锂离子电池负极及高灵敏柔性生理与气体传感器研究。依托在三星电子 IM 部门无线事业部、浦项科技大学（POSTECH）、加拿大卡尔加里大学（University of Calgary）及浦项产业科学研究院（RIST）积累的产学研多元研发经历，共同领导 ACE² Lab。
  card_summary: 초고속 제논 플래시광(IPL) 광열처리와 레이저 유도 그래핀(LIG) 공정을 기반으로 2D MXene·MOF 복합소재를 설계합니다. 이를 통해
    차세대 하이브리드 슈퍼커패시터와 고성능 리튬이온전지 음극을 구현하고, 고감도 유연 생체·가스 센서로 응용 영역을 넓힙니다. 소재 합성에서 소자
    집적까지 이어지는 연구로 에너지 저장과 헬스케어 센싱을 연결합니다.
  card_summary_i18n:
    ko: 초고속 제논 플래시광(IPL) 광열처리와 레이저 유도 그래핀(LIG) 공정을 기반으로 2D MXene·MOF 복합소재를 설계합니다. 이를 통해 차세대 하이브리드 슈퍼커패시터와 고성능 리튬이온전지 음극을 구현하고, 고감도 유연 생체·가스 센서로 응용 영역을 넓힙니다. 소재 합성에서 소자 집적까지 이어지는 연구로 에너지 저장과 헬스케어 센싱을 연결합니다.
    en: Engineers 2D MXene and MOF nanocomposites through ultrafast xenon Intense Pulsed Light (IPL) photothermal processing and Laser-Induced Graphene (LIG) patterning. Realizes next-generation hybrid supercapacitors and high-capacity Li-ion battery anodes while expanding into ultrasensitive flexible bio and gas sensors. Bridges energy storage and healthcare sensing through end-to-end research from material synthesis to device integration.
    ja: 超高速キセノンフラッシュ光（IPL）光熱処理とレーザー誘起グラフェン（LIG）プロセスを基盤に2D MXene・MOF複合材料を設計します。これにより次世代ハイブリッドスーパーキャパシタと高性能リチウムイオン電池負極を実現し、高感度フレキシブル生体・ガスセンサーへと応用領域を広げます。材料合成から素子集積まで一貫した研究により、エネルギー貯蔵とヘルスケアセンシングを架橋します。
    zh: 基于超快氙灯强脉冲光（IPL）光热处理与激光诱导石墨烯（LIG）工艺设计二维 MXene 与 MOF 纳米复合材料。由此实现下一代混合超级电容器与高性能锂离子电池负极，并将应用拓展至高灵敏柔性生物与气体传感器。通过从材料合成到器件集成的全链条研究，架起能量存储与医疗健康传感之间的桥梁。
