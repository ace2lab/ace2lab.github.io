    zh: 核心研究领域 (Core Research Areas)
  home.areas.c1_desc:
    ko: "차세대 하이브리드 코인셀 슈퍼커패시터 및 다공성 MXene/TiO₂ 복합소재 리튬이온전지 음극 설계. 고출력·고에너지밀도 전기화학 소자 구현."
    en: "Next-generation hybrid coin-cell supercapacitors, porous MXene/TiO₂ nanocomposite Li-ion battery anodes, and environmental De-NOₓ catalysts delivering high power and energy density."
    ja: "次世代ハイブリッドコインセル型スーパーキャパシタおよび多孔質MXene/TiO₂複合材料リチウムイオン電池負極の設計。高出力・高エネルギー密度電気化学素子の実現。"
    zh: "设计下一代混合纽扣超级电容器与多孔 MXene/TiO₂ 纳米复合材料锂离子电池负极，实现高功率、高能量密度电化学器件。"
  home.areas.c2_desc:
    ko: "초고속 제논 플래시 펄스광(IPL) 열처리를 활용한 저온·밀리초 급 나노소재 소결·표면 결함 제어 및 레이저 유도 그래핀(LIG) 유연 전극 직접 공정."
    en: "Low-temperature, millisecond-scale nanomaterial sintering and surface defect control via xenon Intense Pulsed Light (IPL) alongside direct Laser-Induced Graphene (LIG) flexible electrode patterning."
    ja: "超高速キセノンフラッシュ光（IPL）熱処理を活用した低温・ミリ秒級ナノ材料焼結・表面欠陥制御、およびレーザー誘起グラフェン（LIG）柔軟電極の直接加工プロセス。"
    zh: "利用超快氙灯强脉冲光（IPL）热处理实现低温毫秒级纳米材料烧结与表面缺陷调控，以及激光诱导石墨烯（LIG）柔性电极直写工艺。"
  home.areas.c3_desc:
    ko: "MXene·레이저 유도 그래핀(LIG) 기반 고감도 유연 촉각·호흡 센서 및 머신러닝 결합 나노 전자코(E-nose) 호기·환경 가스 모니터링 소자."
    en: "High-sensitivity MXene and Laser-Induced Graphene (LIG) flexible tactile/respiration sensors and machine-learning-coupled nanostructured E-nose exhaled breath and gas monitors."
    ja: "MXene・レーザー誘起グラフェン（LIG）に基づく高感度柔軟触覚・呼吸センサー、および機械学習を融合したナノ電子鼻（E-nose）呼気・環境ガスモニタリング素子。"
    zh: "基于 MXene 与激光诱导石墨烯（LIG）的高灵敏柔性触觉与呼吸传感器，以及结合机器学习的纳米电子鼻（E-nose）呼气与环境气体监测器件。"

