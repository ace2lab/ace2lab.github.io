  teaching.c2_desc:
    ko: "연속체 역학 및 미시적 보존 법칙을 기반으로 열전달과 물질전달의 지배방정식을 유도하고, 다상·다성분 화학공정 시스템에서의 전도·대류·복사 열전달과 분자 확산, 계면 수송 및 반응-확산 결합 현상을 통합적으로 해석하며 본 시뮬레이션을 통해 이론적 해법을 가시화합니다."
    en: "Derives governing equations of heat and mass transfer from continuum mechanics and microscopic conservation laws, analyzing conduction, convection, radiation, molecular diffusion, interfacial transport, and coupled reaction-diffusion systems with interactive simulation visualization."
    ja: "連続体力学と微視的保存則に基づき熱移動および物質移動の支配方程式を導出し、多相・多成分化学プロセスにおける伝導・対流・放射熱伝達と分子拡散、界面輸送、反応-拡散結合現象を統合的に解析します。"
    zh: "基于连续介质力学与微观守恒定律推导热量传递与质量传递控制方程，综合解析多相多组分化工系统中的导热、对流、辐射换热以及分子扩散、界面输运与反应-扩散耦合现象。"

  teaching.c3_level:
    ko: "대학원 전공 · 석박사과정"
    en: "Graduate Course · M.S. & Ph.D."
    ja: "大学院専攻 · 修士・博士課程"
    zh: "研究生专业课 · 硕博课程"
  teaching.c3_title:
    ko: "고급나노화학공학"
    en: "Advanced Nano-Chemical Engineering"
    ja: "先端ナノ化学工学"
    zh: "高等纳米化学工程"
  teaching.c3_desc:
    ko: "나노스케일에서의 열역학, 계면 동역학 및 표면·양자 구속 효과를 바탕으로 기능성 유·무기 나노소재의 정밀 합성 원리를 다룹니다. Science, Nature 등 세계 최고 권위 학술지에 게재된 최신 나노·에너지 논문을 심층 강독하고 토론하여 첨단 연구 기획 및 비판적 분석 역량을 함양합니다."
    en: "Explores precision synthesis principles of functional organic-inorganic nanomaterials based on nanoscale thermodynamics, interfacial kinetics, and quantum confinement, paired with critical reading and discussion of frontier energy and nanoscience papers in Science and Nature."
    ja: "ナノスケールにおける熱力学、界面動力学、表面・量子閉じ込め効果に基づき機能性有機・無機ナノ材料の精密合成原理を扱います。ScienceやNature等のトップジャーナルに掲載された最新論文を精読・討論し、先端研究企画力を養います。"
    zh: "基于纳米尺度热力学、界面动力学及表面与量子限域效应，讲授功能有机/无机纳米材料的精密合成原理；通过深度研读与研讨 Science、Nature 等顶级期刊前沿文献，培养高水平科研规划与批判性分析能力。"
  teaching.c3_footer:
    ko: "교재: 최신 학술지 논문 강독 (Science, Nature 등)"
    en: "Material: Frontier Journal Literature (Science, Nature, etc.)"
    ja: "教材: 最新学術誌論文講読 (Science, Nature 等)"
    zh: "教材：前沿顶级期刊文献精读 (Science, Nature 等)"

