  home.about.lead:
    ko: "ACE² Lab(차세대 화학 및 에너지 공학 연구실)은 경북대학교 과학기술대학 에너지화학공학과에서 임창용 교수와 김태욱 교수가 공동 연구책임자(Co-PIs)로 이끄는 융합 나노화학 및 에너지 공학 연구실입니다. 초고속 펄스광(IPL)·레이저 유도 그래핀(LIG) 기반 나노공정과 2차원 MXene·다공성 MOF·금속 산화물 등 기능성 나노소재 설계를 결합하여, 고성능 이차전지·슈퍼커패시터 및 고감도 유연 생체·환경 센서 소자를 개발하고 있습니다."
    en: "ACE² Lab (Advanced Chemical & Energy Engineering Laboratory) in the Department of Energy Chemical Engineering, College of Science and Technology at Kyungpook National University is a convergent nano-chemical and energy engineering group co-directed by Prof. Changyong Yim and Prof. Taewook Kim. By combining Intense Pulsed Light (IPL) and Laser-Induced Graphene (LIG) nanomanufacturing with 2D MXene, porous MOF, and metal-oxide nanomaterial design, we develop high-performance rechargeable batteries, hybrid supercapacitors, environmental catalysts, and flexible bio-environmental sensors."
    ja: "ACE² Lab（次世代化学・エネルギー工学研究室）は、慶北大学校 科学技術大学 エネルギー化学工学科において Changyong Yim 教授と Taewook Kim 教授が共同研究責任者（Co-PIs）として主宰する融合ナノ化学・エネルギー工学研究室です。超高速フラッシュ光（IPL）・レーザー誘起グラフェン（LIG）に基づくナノ製造プロセスと、2次元MXene・多孔質MOF・金属酸化物などの機能性ナノ材料設計を融合し、高性能二次電池・スーパーキャパシタおよび高感度柔軟生体・環境センサー素子を開発しています。"
    zh: "ACE² Lab（下一代化学与能源工程实验室）是庆北大学 科学技术大学 能源化学工程系由 Changyong Yim 教授与 Taewook Kim 教授共同担任首席研究员（Co-PIs）的交叉纳米化学与能源工程实验室。实验室将超快强脉冲光（IPL）与激光诱导石墨烯（LIG）纳米制造工艺同二维 MXene、多孔 MOF 及金属氧化物等功能纳米材料设计相结合，致力于开发高性能二次电池、混合超级电容器、环境催化剂及高灵敏柔性生物与环境传感器件。"
  home.about.p1_title:
    ko: "에너지 저장 및 기능성 소재"
    en: "Energy Storage & Materials"
    ja: "エネルギー貯蔵・機能性材料"
    zh: "能量存储与功能材料"
  home.about.p1_desc:
    ko: "MXene·MOF 복합소재 기반 하이브리드 슈퍼커패시터, 차세대 이차전지 음극 및 환경 촉매 소재"
    en: "Hybrid supercapacitors, next-generation Li-ion battery anodes, and environmental catalysts based on MXene and MOF nanocomposites"
    ja: "MXene・MOF複合材料に基づくハイブリッドスーパーキャパシタ、次世代二次電池負極および環境触媒材料"
    zh: "基于 MXene 与 MOF 纳米复合材料的混合超级电容器、下一代二次电池负极及环境催化材料"
  home.about.p2_title:
    ko: "초고속 광열 나노공정"
    en: "Photonic Nanomanufacturing"
    ja: "超高速光熱ナノ製造プロセス"
    zh: "超快光热纳米制造工艺"
  home.about.p2_desc:
    ko: "초고속 펄스광(IPL) 광열 소결·표면 개질과 레이저 유도 그래핀(LIG) 나노패터닝 및 유연 전극 공정"
    en: "Millisecond Intense Pulsed Light (IPL) photothermal sintering, surface defect engineering, and Laser-Induced Graphene (LIG) flexible electrode patterning"
    ja: "超高速フラッシュ光（IPL）光熱焼結・表面改質とレーザー誘起グラフェン（LIG）ナノパターニングおよび柔軟電極プロセス"
    zh: "超快强脉冲光（IPL）光热烧结与表面改性，以及激光诱导石墨烯（LIG）纳米图案化与柔性电极工艺"
  home.about.p3_title:
    ko: "유연 센서 및 스마트 소자"
    en: "Sensors & Devices"
    ja: "柔軟センサー・スマート素子"
    zh: "柔性传感器与智能器件"
  home.about.p3_desc:
    ko: "고감도 유연 촉각·호흡 센서와 머신러닝 결합 나노 전자코(E-nose) 실시간 모니터링 소자"
    en: "High-sensitivity flexible tactile and respiration sensors alongside machine-learning-assisted nanostructured electronic-nose (E-nose) real-time monitoring devices"
    ja: "高感度柔軟触覚・呼吸センサーおよび機械学習を融合したナノ電子鼻（E-nose）リアルタイムモニタリング素子"
    zh: "高灵敏柔性触觉与呼吸传感器，以及结合机器学习的纳米电子鼻（E-nose）实时监测器件"

  home.copi.intro:
    ko: "본 연구실은 두 명의 공동 연구책임자(Co-Principal Investigators)가 함께 이끌고 있습니다:"
    en: "The laboratory is jointly directed by two Principal Investigators:"
    ja: "当研究室は2名の共同研究責任者（Co-Principal Investigators）により共同主宰されています："
    zh: "本实验室由两位共同首席研究员（Co-Principal Investigators）联合指导："
