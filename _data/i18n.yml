  home.mission.en:
    ko: Pioneering ultrafast photonic nanomanufacturing and functional nanomaterials for high-capacity electrochemical energy storage and wearable bio-environmental devices.
    en: Pioneering ultrafast photonic nanomanufacturing and functional nanomaterials for high-capacity electrochemical energy storage and wearable bio-environmental devices.
    ja: 超高速光熱ナノ製造プロセスと機能性ナノ材料設計を融合し、次世代ハイブリッドエネルギー貯蔵素子および高感度ウェアラブル生体・環境センサー技術を革新します。
    zh: 融合超快光热纳米制造工艺与功能纳米材料设计，革新高容量电化学储能器件与可穿戴生物环境传感器技术。
  home.mission.ko:
    ko: 초고속 광열처리 나노공정과 기능성 나노소재 설계를 융합하여, 차세대 하이브리드 에너지 저장 소자 및 고민감도 유연 센서 기술을 혁신합니다.
    en: Advancing end-to-end chemical and energy engineering from millisecond photonic synthesis to practical electrochemical and sensing systems.
    ja: Pioneering ultrafast photonic nanomanufacturing and functional nanomaterials for high-capacity electrochemical energy storage and wearable bio-environmental devices.
    zh: Pioneering ultrafast photonic nanomanufacturing and functional nanomaterials for high-capacity electrochemical energy storage and wearable bio-environmental devices.

