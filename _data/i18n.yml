  teaching.sim1_title:
    ko: "Stage 2-2: Laminar Falling Film Flow (강하 액막 유동)"
    en: "Stage 2-2: Laminar Falling Film Flow"
    ja: "Stage 2-2: Laminar Falling Film Flow (層流流下液膜流動)"
    zh: "Stage 2-2: Laminar Falling Film Flow (层流降膜流动)"
  teaching.sim1_desc:
    ko: "경사 평면을 따라 중력에 의해 흘러내리는 뉴턴 유체의 층류 강하 액막 유동을 해석합니다. Bird-Stewart-Lightfoot (BSL) 표준 좌표계에 따른 6단계 수식 유도 Manim 애니메이션, 점도·밀도·경사각·유량 조절에 따른 실시간 포물선 유속 및 선형 전단응력 분포를 인터랙티브하게 체험할 수 있습니다."
    en: "Analyzes laminar falling film flow of a Newtonian fluid down an inclined plane under gravity. Features a 6-step Manim mathematical derivation in standard Bird-Stewart-Lightfoot (BSL) coordinates, with interactive controls for viscosity, density, inclination angle, and flow rate to visualize parabolic velocity and linear shear-stress profiles in real time."
    ja: "傾斜平板に沿って重力により流下するニュートン流体の層流液膜流動を解析します。Bird-Stewart-Lightfoot（BSL）標準座標系に基づく6段階の数式導出Manimアニメーションと、粘度・密度・傾斜角・流量の操作による放物線速度分布および線形せん断応力分布をリアルタイムに体験できます。"
    zh: "解析牛顿流体在重力作用下沿倾斜平板流动的层流降膜过程。内置基于 Bird-Stewart-Lightfoot (BSL) 标准坐标系的六步 Manim 方程推导动画，支持实时调节粘度、密度、倾角与流量，直观交互演示抛物线速度分布与线性切应力分布。"
