  research.p1.kicker:
    ko: Pillar 01 · Energy Systems
    en: Pillar 01 · Energy Systems
    ja: Pillar 01 · エネルギー貯蔵・触媒システム
    zh: Pillar 01 · 能量存储与催化系统
  research.p1.title:
    ko: 차세대 에너지 저장 및 기능성 나노소재 (Advanced Energy Storage & Nanomaterials)
    en: Advanced Energy Storage & Nanomaterials
    ja: 先端エネルギー貯蔵および機能性ナノ材料
    zh: 先进能量存储与功能纳米材料
  research.p1.lead:
    ko: "본 연구실은 차세대 전기화학 에너지 저장 및 환경 촉매 시스템을 위한 저차원 나노소재의 합리적 구조 설계와 계면 공학에 집중하고 있습니다. 빠른 이온 전달 동역학과 장기 충·방전 안정성을 갖춘 하이브리드 슈퍼커패시터, 다공성 2D MXene 이차전지 음극재, 그리고 고내구성 환경·에너지 변환 촉매를 개발합니다."
    en: "Our laboratory focuses on rational architecture design and interface engineering of low-dimensional nanomaterials for next-generation electrochemical energy storage and catalytic systems. We develop hybrid supercapacitors, porous 2D MXene battery anodes, and durable energy-conversion catalysts with rapid ion-transport kinetics and long-term cyclic stability."
    ja: "当研究室は、次世代の電気化学エネルギー貯蔵および触媒システムに向けた低次元ナノ材料の合理的構造設計と界面工学に注力しています。高速なイオン輸送カイネティクスと長期サイクル安定性を兼ね備えたハイブリッドスーパーキャパシタ、多孔質2D MXene二次電池負極、および高耐久エネルギー変換・環境触媒を開発しています。"
    zh: "本实验室专注于面向下一代电化学能量存储与催化系统的低维纳米材料合理结构设计与界面工程。我们致力于开发兼具快速离子传输动力学与长循环稳定性的混合超级电容器、多孔二维 MXene 二次电池负极，以及高耐久性环境与能量转换催化剂。"
  research.p1.fig1_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 1(a).</span> 하이브리드 코인셀 슈퍼커패시터 응용을 위한 3D 니켈 폼 위 Co-MOF/Ni–Co 황화물(NCS) 복합 나노페탈 어레이의 상온 연속 합성 (<em>J. Energy Storage</em>, 2024).'
    en: '<span class="ed-pillar__fig-label">Figure 1(a).</span> Room-temperature sequential synthesis of Co-MOF/Ni–Co sulfide (NCS) composite nanopetal arrays on 3D Ni foam for hybrid coin-cell supercapacitors (<em>J. Energy Storage</em>, 2024).'
    ja: '<span class="ed-pillar__fig-label">Figure 1(a).</span> ハイブリッドコインセル型スーパーキャパシタに向けた3Dニッケルフォーム上へのCo-MOF/Ni–Co硫化物（NCS）複合ナノペタルアレイの常温逐次合成 (<em>J. Energy Storage</em>, 2024).'
    zh: '<span class="ed-pillar__fig-label">Figure 1(a).</span> 面向混合纽扣超级电容器的三维泡沫镍基底 Co-MOF/镍钴硫化物（NCS）复合纳米花瓣阵列室温连续合成 (<em>J. Energy Storage</em>, 2024).'
  research.p1.fig2_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 1(b).</span> 리튬이온전지 음극 응용을 위해 적층된 Ti₃C₂Tₓ MXene 필름을 3차원 다공성 MXene/TiO₂ 나노복합체로 순간 전환하는 제논 플래시광(IPL) 구조화 공정 (<em>Chem. Eng. J.</em>, 2024).'
    en: '<span class="ed-pillar__fig-label">Figure 1(b).</span> Instantaneous flashlight-induced structuring of restacked Ti₃C₂Tₓ MXene into a 3D porous MXene/TiO₂ nanocomposite anode for Li-ion batteries (<em>Chem. Eng. J.</em>, 2024).'
    ja: '<span class="ed-pillar__fig-label">Figure 1(b).</span> リチウムイオン電池負極に向け、再積層したTi₃C₂Tₓ MXeneフィルムを3次元多孔質MXene/TiO₂ナノ複合体へと瞬時に構造化するフラッシュ光（IPL）処理 (<em>Chem. Eng. J.</em>, 2024).'
    zh: '<span class="ed-pillar__fig-label">Figure 1(b).</span> 利用强脉冲闪光（IPL）将重堆叠 Ti₃C₂Tₓ MXene 薄膜瞬态构建为用于锂离子电池负极的三维多孔 MXene/TiO₂ 纳米复合材料 (<em>Chem. Eng. J.</em>, 2024).'

  research.p1.t1.title:
    ko: 하이브리드 슈퍼커패시터 및 구조형 전극
    en: Hybrid Supercapacitors & Structural Electrodes
    ja: ハイブリッドスーパーキャパシタおよび構造型電極
    zh: 混合超级电容器与结构电极
  research.p1.t1.body:
    ko: "금속-유기 골격체(Co-MOF) 및 전이금속 황화물(Ni–Co sulfide) 복합 나노페탈 어레이 합성과 더불어, 레이저 및 초고속 펄스광(IPL)으로 설계된 Co₃O₄·Co(OH)₂ 탄소나노섬유 전극을 통해 출력 특성 저하 없이 높은 에너지 밀도를 구현합니다."
    en: "Synthesis of metal-organic framework (Co-MOF) and transition metal sulfide (Ni–Co sulfide) composite nanopetal arrays, alongside laser- and IPL-engineered Co₃O₄ and Co(OH)₂ carbon nanofiber electrodes delivering high energy density without sacrificing power capability."
    ja: "金属有機構造体（Co-MOF）と遷移金属硫化物（Ni–Co sulfide）複合ナノペタルアレイの合成に加え、レーザーおよびフラッシュ光（IPL）で設計したCo₃O₄・Co(OH)₂炭素ナノファイバー電極により、出力特性を損なうことなく高エネルギー密度を実現します。"
    zh: "合成金属有机框架（Co-MOF）与过渡金属硫化物（Ni–Co sulfide）复合纳米花瓣阵列，并结合激光与强脉冲光（IPL）构筑 Co₃O₄ 及 Co(OH)₂ 碳纳米纤维电极，在不牺牲功率特性的前提下实现高能量密度。"
  research.p1.t2.title:
    ko: 2D MXene 및 차세대 이차전지 음극재
    en: 2D MXene & Next-Generation Battery Anodes
    ja: 2D MXeneおよび次世代二次電池負極材
    zh: 二维 MXene 与下一代二次电池负极材料
  research.p1.t2.body:
    ko: "2차원 Ti₃C₂Tₓ 및 바나듐계 MXene의 토포케미컬 전환, 수직 배향 및 광열 다공성 구조화를 통해 나노시트 재적층(Restacking)을 방지하고 리튬이온 및 전고체전지의 충·방전 부피 팽창을 완충합니다."
    en: "Topochemical conversion, vertical alignment, and photothermal structuring of 2D Ti₃C₂Tₓ and vanadium-based MXenes into porous MXene/TiO₂ architectures to prevent sheet restacking and buffer volumetric expansion in Li-ion and solid-state batteries."
    ja: "2次元Ti₃C₂Tₓおよびバナジウム系MXeneのトポケミカル変換、垂直配向、および光熱多孔質構造化により、ナノシートの再積層を抑制し、リチウムイオン電池や全固体電池における体積膨張を緩衝します。"
    zh: "通过对二维 Ti₃C₂Tₓ 与钒基 MXene 进行拓扑化学转化、垂直取向调控及光热多孔构筑，形成多孔 MXene/TiO₂ 复合结构，有效抑制纳米片重堆叠并缓冲锂离子电池与全固态电池中的体积膨胀。"
  research.p1.t3.title:
    ko: 환경 촉매(De-NOx SCR) 및 적층제조 소재 내구성
    en: Environmental Catalysis & Structural Durability
    ja: 環境触媒（De-NOx SCR）および積層造形材料の耐久性
    zh: 环境催化（De-NOx SCR）与增材制造材料结构耐久性
  research.p1.t3.body:
    ko: "질소산화물(NOₓ)의 선택적 촉매 환원(SCR)을 위한 V₂O₅–WO₃/TiO₂ 촉매 설계, 산업용 나트륨계 탈황 흡착제 재생 공정, 그리고 3D 적층제조 합금의 실시간 수소취화 저항성 진단 기술을 연구합니다."
    en: "Rational design of V₂O₅–WO₃/TiO₂ catalysts for selective catalytic reduction (SCR) of NOₓ, regeneration of industrial Na-based desulfurization sorbents, and in-situ hydrogen embrittlement diagnostics of additively manufactured alloys."
    ja: "窒素酸化物（NOₓ）の選択的触媒還元（SCR）に向けたV₂O₅–WO₃/TiO₂触媒の合理的設計、産業用ナトリウム系脱硫吸着剤の再生、および3D積層造形合金のその場（in-situ）水素脆化診断技術を研究しています。"
    zh: "合理设计用于氮氧化物（NOₓ）选择性催化还原（SCR）的 V₂O₅–WO₃/TiO₂ 催化剂、工业钠基脱硫吸附剂再生工艺，以及 3D 增材制造合金的原位氢脆抗性诊断技术。"

  research.p2.kicker:
    ko: Pillar 02 · Photonic Processing
    en: Pillar 02 · Photonic Processing
    ja: Pillar 02 · 超高速光熱ナノ製造プロセス
    zh: Pillar 02 · 超快光热纳米制造工艺
  research.p2.title:
    ko: 초고속 광열 나노공정 (Ultrafast Photonic Nanomanufacturing)
    en: Ultrafast Photonic Nanomanufacturing
    ja: 超高速光熱ナノ製造プロセス (Ultrafast Photonic Nanomanufacturing)
    zh: 超快光热纳米制造工艺 (Ultrafast Photonic Nanomanufacturing)
  research.p2.lead:
    ko: "기존의 고온 전기로 열처리 공정은 수 시간이 소요되며 열에 취약한 유연 고분자 기판을 손상시키고 원치 않는 상분리를 유발합니다. ACE² Lab은 상온·밀리초(ms) 단위의 나노제조 플랫폼으로서 초고속 제논 펄스광(IPL) 광열 소결과 레이저 유도 탄화(LIG) 공정을 선도하고 있습니다."
    en: "Conventional thermal annealing requires hours in high-temperature furnaces, damaging flexible polymer substrates and inducing unwanted phase segregation. ACE² Lab pioneers Intense Pulsed Light (IPL) flash sintering and laser-assisted photothermal processing as a room-temperature, millisecond-scale nanomanufacturing platform."
    ja: "従来の高温電気炉による熱処理は数時間を要し、熱に弱い柔軟高分子基板の損傷や望ましくない相分離を引き起こします。ACE² Labは、常温・ミリ秒単位のナノ製造プラットフォームとして、フラッシュランプ光焼結（IPL）およびレーザー支援光熱プロセスを先導しています。"
    zh: "传统高温管式炉退火耗时数小时，易损伤热敏柔性高分子基底并引发非预期的相分离。ACE² Lab 开拓了以强脉冲光（IPL）闪光烧结与激光辅助光热加工为核心的室温、毫秒级超快纳米制造平台。"
  research.p2.fig1_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 2(a).</span> 콜로이드 양자점(PbS CQD) 박막의 열유도 표면 트랩 억제를 위한 밀리초 플래시광 어닐링(FLA) 광열 표면 처리 (<em>Small</em>, 2024, Front Cover 선정).'
    en: '<span class="ed-pillar__fig-label">Figure 2(a).</span> Millisecond flashlight annealing (FLA) photothermal surface treatment of PbS colloidal quantum dot (CQD) films for surface trap suppression (<em>Small</em>, 2024, Front Cover).'
    ja: '<span class="ed-pillar__fig-label">Figure 2(a).</span> PbSコロイド量子ドット（CQD）薄膜の表面トラップ準位を抑制するミリ秒フラッシュ光アニーリング（FLA）光熱表面処理 (<em>Small</em>, 2024, Front Cover).'
    zh: '<span class="ed-pillar__fig-label">Figure 2(a).</span> 抑制 PbS 胶体量子点（CQD）薄膜热诱导表面缺陷态的毫秒级闪光退火（FLA）光热表面处理技术 (<em>Small</em>, 2024, 封面论文).'
  research.p2.fig2_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 2(b).</span> 포름산구리 및 Cu–Ag 하이브리드 나노입자의 제논 플래시 램프 광열 환원·소결을 통한 내산화성 고전도성 전극 형성 (<em>ACS Appl. Mater. Interfaces</em>).'
    en: '<span class="ed-pillar__fig-label">Figure 2(b).</span> Xenon flash lamp photothermal reduction and sintering of copper formate / Cu–Ag hybrid nanoparticles into oxidation-resistant conductive electrodes (<em>ACS Appl. Mater. Interfaces</em>).'
    ja: '<span class="ed-pillar__fig-label">Figure 2(b).</span> ギ酸銅およびCu–Agハイブリッドナノ粒子のキセノンフラッシュランプ光熱還元・焼結による耐酸化性導電電極の形成 (<em>ACS Appl. Mater. Interfaces</em>).'
    zh: '<span class="ed-pillar__fig-label">Figure 2(b).</span> 利用氙灯闪光灯对甲酸铜及 Cu–Ag 复合纳米颗粒进行光热还原与烧结，制备抗氧化高导电电极走线 (<em>ACS Appl. Mater. Interfaces</em>).'

  research.p2.t1.title:
    ko: 초고속 펄스광(IPL) 소결 및 상전이 제어
    en: Intense Pulsed Light (IPL) Sintering & Phase Engineering
    ja: フラッシュランプ光焼結（IPL）および結晶相エンジニアリング
    zh: 强脉冲光（IPL）烧结与相变工程
  research.p2.t1.body:
    ko: "광대역 제논 플래시 램프에서 방출되는 고에너지 밀리초 광학 펄스를 통해 선택적 광열 전환을 유도하며, 열변색 스마트 윈도우용 VO₂(B) → VO₂(M) 초고속 상전이 제어 및 유연 기판 위 내산화성 금속 배선 소결을 달성합니다."
    en: "Broad-spectrum xenon flash lamp irradiation delivering high-energy millisecond optical pulses for selective photothermal conversion, enabling ultrafast VO₂(B) → VO₂(M) phase engineering for thermochromic smart windows and oxidation-resistant metallic tracks on flexible substrates."
    ja: "広帯域キセノンフラッシュランプによる高エネルギー・ミリ秒光パルス照射で選択的な光熱変換を誘起し、サーモクロミックスマートウィンドウ向けVO₂(B) → VO₂(M)超高速相転移制御や柔軟基板上の耐酸化性金属配線焼結を実現します。"
    zh: "利用宽谱氙灯闪光灯发射的高能毫秒光脉冲实现选择性光热转化，驱动热致变色智能窗中 VO₂(B) → VO₂(M) 的超快相变调控，并在柔性基底上实现抗氧化金属导电走线的低温光烧结。"
  research.p2.t2.title:
    ko: 광열 표면 개질 및 결함 제어 공학
    en: Photothermal Surface & Defect Engineering
    ja: 光熱表面改質および欠陥エンジニアリング
    zh: 光热表面改性及缺陷调控工程
  research.p2.t2.body:
    ko: "밀리초 펄스광 표면 처리와 계면 공학을 통해 하부 기능성 박막 손상 없이 열유도 표면 트랩 준위를 치유하고 산소 공공(Oxygen vacancy) 농도를 제어하며 다공성 2D MXene/산화물 나노복합체를 구조화합니다."
    en: "Millisecond pulsed-light surface treatment and interface engineering to heal thermally induced surface trap states, control oxygen vacancies, and structure porous 2D MXene/oxide nanocomposites without damaging underlying functional layers."
    ja: "ミリ秒パルス光による表面処理と界面工学を通じて、下層の機能層を損傷することなく熱誘起表面トラップ準位を修復し、酸素空孔を制御するとともに、多孔質2D MXene/酸化物ナノ複合体を構造化します。"
    zh: "通过毫秒脉冲光表面处理与界面工程，在不损伤底层功能薄膜的前提下修复热诱导表面陷阱态、调控氧空位浓度，并构筑多孔二维 MXene/氧化物纳米复合结构。"
  research.p2.t3.title:
    ko: 플래시 및 레이저 유도 그래핀 (FIG / LIG)
    en: Flash- & Laser-Induced Graphene (FIG / LIG)
    ja: フラッシュ・レーザー誘起グラフェン (FIG / LIG)
    zh: 闪光与激光诱导石墨烯 (FIG / LIG)
  research.p2.t3.body:
    ko: "폴리이미드 필름, 셀룰로오스 종이 및 인쇄 토너를 대기 중에서 마스크 없이 광열 흑연화하여 마이크로 슈퍼커패시터, 수분 유도 발전 소자 및 웨어러블 전자소자용 3차원 다공성 그래핀 전극을 직접 제작합니다."
    en: "Maskless, ambient-air photothermal graphitization of polyimide films, cellulose papers, and printed toner into 3D porous graphene electrodes for micro-supercapacitors, moisture-driven power generators, and wearable electronics."
    ja: "ポリイミドフィルム、セルロース紙、および印刷トナーを大気中でマスクレス光熱黒鉛化し、マイクロスーパーキャパシタ、水分誘起発電素子、ウェアラブル電子機器向けの3次元多孔質グラフェン電極を直接作製します。"
    zh: "在常温大气环境下对聚酰亚胺薄膜、纤维素纸及印刷碳粉进行无掩模光热石墨化，直接制备面向微型超级电容器、湿气诱导发电器件及可穿戴电子产品的三维多孔石墨烯电极。"

  research.p3.kicker:
    ko: Pillar 03 · Sensor Technologies
    en: Pillar 03 · Sensor Technologies
    ja: Pillar 03 · 柔軟センサー・バイオ環境素子
    zh: Pillar 03 · 柔性传感与生物环境器件
  research.p3.title:
    ko: 유연 센서 및 생체·환경 모니터링 소자 (Flexible Sensors & Bio-Environmental Devices)
    en: Flexible Sensors & Bio-Environmental Devices
    ja: 柔軟センサーおよび生体・環境モニタリング素子
    zh: 柔性传感器与生物/环境监测器件
  research.p3.lead:
    ko: "ACE² Lab은 실시간 헬스케어 생체신호 모니터링, 호기(날숨) 기반 질병 진단, 유해 환경가스 감지를 위한 유연 웨어러블 센싱 시스템을 설계합니다. 2D MXene, 레이저 유도 그래핀(LIG), 반도체 나노구조체와 머신러닝 데이터 분석을 결합하여 높은 민감도·선택성·기계적 신뢰성을 달성합니다."
    en: "ACE² Lab designs flexible, wearable, and environmental sensing systems for real-time healthcare biomonitoring, exhaled breath diagnosis, and toxic gas detection. By combining 2D MXenes, laser-induced graphene, semiconductor nanostructures, and machine-learning analytics, we achieve high sensitivity, selectivity, and mechanical reliability."
    ja: "ACE² Labは、リアルタイムのヘルスケア生体モニタリング、呼気診断、および有害ガス検知に向けた柔軟・ウェアラブルセンシングシステムを設計しています。2D MXene、レーザー誘起グラフェン（LIG）、半導体ナノ構造と機械学習解析を融合し、高い感度・選択性・機械的信頼性を実現します。"
    zh: "ACE² Lab 设计面向实时医疗健康生理监测、呼气疾病诊断及有毒有害气体检测的柔性与可穿戴传感系统。通过结合二维 MXene、激光诱导石墨烯（LIG）、半导体纳米结构与机器学习算法，实现高灵敏度、高选择性与优异的机械可靠性。"
  research.p3.fig1_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 3(a).</span> 실시간 심폐소생술(CPR) 압박 깊이·속도 피드백을 위해 무선 모바일 텔레메트리와 결합된 다층 MXene/한지(닥종이) 기반 유연 촉각 센서 (<em>Small</em>, 2026).'
    en: '<span class="ed-pillar__fig-label">Figure 3(a).</span> Multi-layered MXene/mulberry-paper flexible tactile sensor integrated with wireless mobile telemetry for real-time CPR compression depth and rate feedback (<em>Small</em>, 2026).'
    ja: '<span class="ed-pillar__fig-label">Figure 3(a).</span> リアルタイム心肺蘇生（CPR）圧迫深度・速度フィードバックに向け、無線モバイルテレメトリと統合した多層MXene／韓紙（コウゾ紙）柔軟触覚センサー (<em>Small</em>, 2026).'
    zh: '<span class="ed-pillar__fig-label">Figure 3(a).</span> 集成无线移动遥测功能的多层 MXene/桑皮纸柔性触觉传感器，用于心肺复苏（CPR）按压深度与频率的实时反馈 (<em>Small</em>, 2026).'
  research.p3.fig2_cap:
    ko: '<span class="ed-pillar__fig-label">Figure 3(b).</span> 호기 일산화질소(NO) 분석 및 호흡기 질환 진단을 위한 나노구조 복합 전자코(E-nose) 어레이 및 머신러닝 특징 추출 파이프라인 (<em>Chem. Eng. J.</em>, 2026).'
    en: '<span class="ed-pillar__fig-label">Figure 3(b).</span> Nanostructured composite electronic-nose (E-nose) array coupled with machine-learning feature extraction for exhaled nitric oxide (NO) breathomics and respiratory diagnosis (<em>Chem. Eng. J.</em>, 2026).'
    ja: '<span class="ed-pillar__fig-label">Figure 3(b).</span> 呼気一酸化窒素（NO）解析および呼吸器疾患診断のためのナノ構造複合電子鼻（E-nose）アレイと機械学習特徴抽出パイプライン (<em>Chem. Eng. J.</em>, 2026).'
    zh: '<span class="ed-pillar__fig-label">Figure 3(b).</span> 结合机器学习特征提取的纳米复合电子鼻（E-nose）传感器阵列，用于呼出气一氧化氮（NO）分析与呼吸系统疾病辅助诊断 (<em>Chem. Eng. J.</em>, 2026).'

  research.p3.t1.title:
    ko: 유연 촉각 및 호흡 헬스케어 센서
    en: Flexible Tactile & Respiration Healthcare Sensors
    ja: 柔軟触覚および呼吸ヘルスケアセンサー
    zh: 柔性触觉与呼吸医疗健康传感器
  research.p3.t1.body:
    ko: "실시간 심폐소생술(CPR) 피드백 등 광대역 압력 감지가 가능한 다층 MXene 코팅 한지 촉각 센서와, 인체 호흡을 연속 추적하는 레이저 직접 패터닝 3D 다공성 그래핀(LIG) 습도 센서를 개발합니다."
    en: "Multi-layered MXene-coated mulberry paper tactile sensors for wide-pressure-range wearable monitoring (such as real-time CPR feedback) and direct-laser-written 3D porous graphene (LIG) humidity sensors for continuous human respiration tracking."
    ja: "リアルタイムCPRフィードバックなど広範囲な圧力検知が可能な多層MXeneコーティング韓紙触覚センサーと、ヒトの呼吸を連続追跡するレーザー直接描画3D多孔質グラフェン（LIG）湿度センサーを開発しています。"
    zh: "开发用于宽压力范围可穿戴监测（如实时 CPR 按压反馈）的多层 MXene 涂覆桑皮纸柔性触觉传感器，以及用于人体呼吸连续监测的激光直写三维多孔石墨烯（LIG）湿度传感器。"
  research.p3.t2.title:
    ko: 인공지능(AI) 결합 나노 전자코 및 호기 진단
    en: AI-Assisted Electronic Nose & Breathomics
    ja: AI支援型電子鼻（E-nose）および呼気診断
    zh: 人工智能辅助电子鼻（E-nose）与呼气组学诊断
  research.p3.t2.body:
    ko: "InGaN/GaN 다중양자우물(MQW) 나노와이어, Ga₂O₃/Ti₃C₂Tₓ MXene 이종접합, Pd/rGO 기능화 중공 SnO₂ 나노구체를 머신러닝 알고리즘과 결합하여 sub-ppm급 NO, NO₂, NH₃ 및 아세톤 바이오마커를 고선택성으로 판별합니다."
    en: "Integration of InGaN/GaN multi-quantum-well (MQW) nanowires, Ga₂O₃/Ti₃C₂Tₓ MXene heterostructures, and Pd/rGO-sensitized hollow SnO₂ nanospheres with machine-learning algorithms for selective sub-ppm NO, NO₂, NH₃, and acetone biomarker detection."
    ja: "InGaN/GaN多重量子井戸（MQW）ナノワイヤ、Ga₂O₃/Ti₃C₂Tₓ MXeneヘテロ構造、およびPd/rGO増感中空SnO₂ナノ球体を機械学習アルゴリズムと統合し、sub-ppmレベルのNO、NO₂、NH₃、アセトン生体指標を高選択的に検出します。"
    zh: "将 InGaN/GaN 多量子阱（MQW）纳米线、Ga₂O₃/Ti₃C₂Tₓ MXene 异质结及 Pd/rGO 敏化中空 SnO₂ 纳米球与机器学习算法深度融合，实现对亚 ppm 级 NO、NO₂、NH₃ 及丙酮生物标志物的高选择性识别。"
  research.p3.t3.title:
    ko: 마이크로 공진기 및 나노다공성 흡착 플랫폼
    en: Microresonator & Nanoporous Sorbent Platforms
    ja: マイクロ共振器およびナノ多孔質吸着プラットフォーム
    zh: 微纳谐振器与纳米多孔吸附传感平台
  research.p3.t3.body:
    ko: "수정진동자 미세저울(QCM) 및 마이크로캔틸레버 어레이 표면에 나노다공성 금속-유기 골격체(ZIF-8, MIL-53, Cu-BDC)를 직접 기능화하여 휘발성 유기화합물(VOC), CO₂ 및 병원체 면역반응을 초고감도로 정량 감지합니다."
    en: "Direct functionalization of quartz crystal microbalances (QCM) and microcantilever arrays with nanoporous metal-organic frameworks (ZIF-8, MIL-53, Cu-BDC) for gravimetric VOC, CO₂, and pathogen immunoassay sensing."
    ja: "水晶振動子マイクロバランス（QCM）やマイクロカンチレバーアレイにナノ多孔質金属有機構造体（ZIF-8, MIL-53, Cu-BDC）を直接機能化し、VOC、CO₂、および病原体免疫アッセイの重量変化型高感度センシングを行います。"
    zh: "在石英晶体微天平（QCM）与微悬臂梁阵列上直接功能化修饰纳米多孔金属有机框架（ZIF-8、MIL-53、Cu-BDC），实现挥发性有机物（VOCs）、CO₂ 及病原体免疫分析的高灵敏质量型传感。"

