  teaching.c1_title:
    ko: "고분자 합성 및 물성"
    en: "Polymer Synthesis & Properties"
    ja: "高分子合成および物性"
    zh: "高分子合成与物性"
  teaching.c1_desc:
    ko: "단계성장 및 사슬성장 중합의 반응 속도론과 열역학적 메커니즘을 규명하고, 분자량 분포, 사슬 형태, 유리전이 및 결정화 거동, 점탄성 등 고분자 사슬의 미시적 구조와 거시적 물리·기계적 물성 간의 구조-물성 상관관계를 체계적으로 다룹니다."
    en: "Covers reaction kinetics and thermodynamic mechanisms of step-growth and chain-growth polymerization, systematically linking molecular weight distribution, chain conformation, glass transition, crystallization, and viscoelasticity to macroscopic physical and mechanical properties."
    ja: "段階成長および連鎖成長重合の反応速度論と熱力学的機構を解明し、分子量分布、鎖コンフォメーション、ガラス転移・結晶化挙動、粘弾性など高分子鎖の微視的構造と巨視的物性の相関を体系的に扱います。"
    zh: "阐明逐步聚合与链式聚合的反应动力学及热力学机制，系统讲授分子量分布、链构象、玻璃化转变、结晶行为及粘弹性等高分子微观结构与宏观物理机械性能之间的构效关系。"
