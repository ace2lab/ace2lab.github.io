  home.ai.desc:
    ko: ACE² Lab은 연구 행정과 일상 커뮤니케이션에 인공지능 에이전트를 실전 도입하여, 연구진이 고부가가치 실험과 창의적 연구에 온전히 몰입할 수 있는 환경을 만듭니다.
    en: ACE² Lab deploys an autonomous AI executive agent for research administration and communications, enabling researchers to fully focus on high-value experiments and creative ideas.
    ja: ACE² Labは研究行政と日常業務にAIエージェントを実戦導入し、研究陣が高付加価値の実験と創造的研究に専念できる環境を構築しています。
    zh: ACE² Lab 将人工智能智能体引入日常科研行政与协作中，让研究团队能够全身心投入于高价值实验与创新科研。
